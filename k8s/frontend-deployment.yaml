apiVersion: v1
kind: Service
metadata:
  name: webapp-frontend
  namespace: webapp-prod
spec:
  selector:
    app: webapp-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-frontend
  namespace: webapp-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-frontend
  template:
    metadata:
      labels:
        app: webapp-frontend
    spec:
      containers:
        - name: frontend
          # TODO: replace with your actual GHCR image path
          image: ghcr.io/YOUR_GITHUB_USERNAME/single-server-3tier-webapp-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
