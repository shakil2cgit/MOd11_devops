apiVersion: v1
kind: Service
metadata:
  name: webapp-backend
  namespace: webapp-prod
spec:
  selector:
    app: webapp-backend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-backend
  namespace: webapp-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-backend
  template:
    metadata:
      labels:
        app: webapp-backend
    spec:
      containers:
        - name: backend
          # TODO: replace with your actual GHCR image path
          image: ghcr.io/YOUR_GITHUB_USERNAME/single-server-3tier-webapp-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: webapp-secrets
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: webapp-config
            - secretRef:
                name: webapp-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
