# Example Secret manifest. DO NOT use real values or commit real credentials.
# In CI/CD we will create/update the actual Secret from GitHub Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: webapp-secrets
  namespace: webapp-prod
type: Opaque
stringData:
  DB_USER: "bmi_user"
  DB_PASSWORD: "change-me"
  DATABASE_URL: "postgresql://bmi_user:change-me@bmi-db:5432/bmidb"
  JWT_SECRET: "replace-me"
