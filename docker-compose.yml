version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bmi-postgres
    environment:
      POSTGRES_DB: bmidb
      POSTGRES_USER: bmi_user
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: bmi-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://bmi_user:strongpassword@postgres:5432/bmidb
    depends_on:
      - postgres
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: bmi-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
